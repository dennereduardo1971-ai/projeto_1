# Prova piloto: TCU 2025 — Auditor Federal de Controle Externo.
# Certo/Errado, com texto de apoio compartilhado entre blocos de itens.
extends: ce_bloco
nome: tcu_25_aufc

prova:
  banca: CEBRASPE
  ano: 2025
  orgao: TCU
  cargo: Auditor Federal de Controle Externo
  # CALIBRAR: cadernos de cores diferentes trazem os mesmos itens em ordem
  # diferente. Fixamos o tipo 1 e deduplicamos por enunciado normalizado.
  # Conferir no PDF real qual rótulo o caderno usa ("Tipo 1 — BRANCA" etc.).
  tipo_caderno: "1"
  pagina_concurso: https://www.cebraspe.org.br/concursos/tcu_25_aufc

numeracao:
  minimo: 1
  # CALIBRAR: o total de itens do caderno do TCU 2025 não foi verificado
  # (egresso bloqueado nesta sessão). 120 é teto folgado; ajustar ao número real
  # e então `exige_total: true` passa a valer como verificação forte.
  maximo: 120
  exige_sequencia: true

layout:
  colunas: auto

descartar:
  - '^\s*$'
  - '(?i)^espa[çc]o\s+livre\.?$'
  - '(?i)^rascunho$'
  - '(?i)^cebraspe\b'
  - '(?i)^cargo\s+\d+\s*:'
  - '(?i)^aplica[çc][ãa]o\s*:'
  - '^[\-–—]\s*\d{1,3}\s*[\-–—]$'
  - '(?i)^tribunal\s+de\s+contas\s+da\s+uni[ãa]o\b'
  - '(?i)^auditor\s+federal\s+de\s+controle\s+externo\b'
