# Perfil base. Todo perfil herda daqui com `extends: _base`.
# Valores aqui são o denominador comum do Cebraspe; o que varia por prova vem
# no perfil filho.
nome: _base
formato: ce
penalidade_por_erro: true
alternativas_esperadas: 0

layout:
  # CALIBRAR: os cadernos objetivos do Cebraspe que vi descritos são de DUAS colunas,
  # mas isso varia por cargo e por ano. `auto` detecta a partir do histograma de
  # espaço em branco vertical; se a detecção errar no primeiro caderno real, trave
  # em 1 ou 2 aqui e registre em docs/agents/coletor.md → Armadilhas.
  colunas: auto
  gap_coluna_min: 24        # pt de calha vazia que caracteriza separação de colunas
  tolerancia_linha: 2.5     # pt de variação de `top` para palavras na mesma linha
  # CALIBRAR: frações de cabeçalho/rodapé medidas em página A4 (842 pt).
  # 0.06 ≈ 50 pt. Confirmar contra a faixa do cabeçalho real antes de confiar.
  margem_topo_frac: 0.06
  margem_rodape_frac: 0.05

# Linhas inteiras que somem antes da segmentação.
descartar:
  - '^\s*$'
  - '(?i)^espa[çc]o\s+livre\.?$'
  - '(?i)^rascunho$'
  - '(?i)^cebraspe\b'
  - '(?i)^cargo\s+\d+\s*:'
  - '(?i)^aplica[çc][ãa]o\s*:'
  - '^[\-–—]\s*\d{1,3}\s*[\-–—]$'   # "– 7 –" no rodapé
  - '(?i)^p[áa]gina\s+\d+\s+de\s+\d+$'
  # Parágrafos numerados de instrução da CAPA do caderno (recorrentes em
  # praticamente toda prova Cebraspe: "1 Ao receber este caderno de
  # prova...", "2 Quando autorizado(a)...", ...). Sem isto eles batem com o
  # marcador de item (número + texto) e viram as "questões" 1, 2, 3... por
  # engano, empurrando a numeração real inteira (visto na prova PGDF 2022).
  - '(?i)ao\s+receber\s+este\s+caderno\s+de\s+prova'
  - '(?i)quando\s+autorizad[oa]\s*\([ao]\)\s+pel[oa]\s*\([ao]\)\s+chefe\s+de\s+sala'
  - '(?i)durante\s+a\s+realiza[çc][ãa]o\s+da\s+prova\s*,\s*n[ãa]o\s+se\s+comunique'
  - '(?i)na\s+dura[çc][ãa]o\s+da\s+prova\s*,?\s*est[áa]\s+inclu[íi]do'
  - '(?i)ao\s+terminar\s+a\s+prova\s*,\s*chame\s+o\s*\(a\)\s+aplicador'
  - '(?i)nenhuma\s+folha\s+deste\s+caderno\s+pode\s+ser\s+destacada'
  - '(?i)a\s+desobedi[êe]ncia\s+a\s+qualquer\s+uma\s+das\s+determina[çc][õo]es'
  - '(?i)leia\s+com\s+aten[çc][ãa]o\s+as\s+instru[çc][õo]es\s+abaixo'

marcadores:
  # Número do item na margem, seguido do texto. A guarda contra falso positivo
  # (um "2025" no meio do texto) é a sequência: ver numeracao.exige_sequencia.
  item: '^(?P<numero>\d{1,3})\s+(?P<resto>\S.*)$'
  alternativa: '^(?P<letra>[A-E])\s+(?P<resto>\S.*)$'
  # Frase que abre um bloco de itens e amarra o texto de apoio.
  instrucao: '(?i)(\bjulgue\b|assinale\s+a\s+op[çc][ãa]o|com\s+rela[çc][ãa]o\s+ao\s+texto)'
  # Cabeçalho do bloco de texto de apoio: "Texto CB1A1-I"
  # CALIBRAR: no Cebraspe o rótulo aparece ANTES do texto. Se em algum caderno
  # ele vier depois (como legenda), inverter aqui e no segmentador.
  inicio_texto_apoio: '(?i)^texto[s]?\s+(?P<id>[A-Z0-9]{2,}[\-–]?[IVX0-9]*)\s*$'
  # Referência explícita dentro da instrução: "A respeito do texto CB1A1-I, julgue…"
  referencia_texto_apoio: '(?i)\btexto\s+(?P<id>[A-Z]{1,3}\d[A-Z0-9]*[\-–]?[IVX0-9]*)'
  # Referência implícita: "Considerando o texto precedente, julgue o item a seguir."
  referencia_precedente: '(?i)texto[s]?\s+(precedente|anterior|acima|apresentad[oa])'
  fim_prova: '(?i)^\s*fim\s+da\s+prova\s*$'

numeracao:
  minimo: 1
  maximo: 200
  # Um marcador de item só vale se o número for exatamente o anterior + 1.
  # É esta regra — e não o regex — que segura o parser de pé.
  exige_sequencia: true

assets:
  capturar_tabelas: true
  capturar_imagens: true
  capturar_formulas: false   # CALIBRAR: fórmula não tem marcador estrutural em PDF;
                             # hoje só capturamos o que o pdfplumber vê como tabela/imagem.
  resolucao_dpi: 200
  area_minima: 4000          # pt²; abaixo disso é filete de layout, não conteúdo

ocr:
  # OCR está FORA da v1. Página abaixo deste limiar é considerada sem camada de
  # texto: a prova inteira é recusada com status `precisa_ocr`.
  min_chars_por_pagina: 120
